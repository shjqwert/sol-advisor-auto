interface:
  display_name: "Sol Advisor Orchestration"
  short_description: "Delegate only for context or quality benefit"
  default_prompt: "Use $orchestration to keep complex implementation in this session, isolate child-owned work until one final result returns, and delegate only when bounded context or quality benefit exceeds coordination cost; implicit dispatch also requires the project's exact authorization signals."

policy:
  allow_implicit_invocation: true
